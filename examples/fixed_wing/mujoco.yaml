terrain: plains

vehicle:
  airframe: twin_wing

initial_state:
  velocity_mps: [12.48, 8.32, 0.0]
  heading_deg: 33.69
  body_rates_rps: [0.0, 0.0, 0.0]

simulation:
  backend: mujoco_fixedwing
  duration: 12.0
  dt: 0.02
  seed: 11
  fixedwing:
    # Mass, inertia, planform and motor layout come from the shared airframe
    # spec, aerial_kit/airframes/twin_wing/twin_wing.yaml. Keys set here
    # would override it; leave them out unless you mean to.
    wind_mps: [0.0, 0.0, 0.0]
  mujoco:
    timestep: 0.002
    thrust_tau_s: 0.03
    # airframe_spec: path/to/another_twin_wing.yaml

controller:
  type: l1_tecs
  l1_tecs:
    cruise_airspeed_mps: 15.0
    l1_distance_m: 40.0
    max_bank_rad: 0.7854
    trim_throttle_n: 3.0
    tecs_kp_throttle: 0.15
    tecs_kp_pitch: 0.08
    kp_roll: 0.6
    kd_roll: 0.15
    kp_pitch: 0.8
    kd_pitch: 0.2

path:
  planner_type: dubins
  waypoint_acceptance_m: 6.0
  lookahead_waypoints: 5
  start_relative_x: 0.08
  start_relative_y: 0.12
  start_relative_z: 0.50
  end_relative_x: 0.82
  end_relative_y: 0.78
