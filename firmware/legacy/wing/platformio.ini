; AerialKit fixed-wing firmware — one runtime, two vehicle profiles, four board ports.
;   profiles: single_wing (1 motor, no yaw actuator), twin_wings (2 motors, differential yaw)
;   ports:    esp32c3, esp32, f411, f405
; The profile is a compile-time flag; the runtime sources are shared by every env.
; See README.md.

[platformio]
default_envs = wing_single_esp32c3

[wing]
framework = arduino
monitor_speed = 115200

[env:wing_single_esp32c3]
extends = wing
platform = espressif32@^6.5.0
board = esp32-c3-devkitm-1
build_flags = -DAK_AIRFRAME_SINGLE

[env:wing_twin_esp32c3]
extends = wing
platform = espressif32@^6.5.0
board = esp32-c3-devkitm-1
build_flags = -DAK_AIRFRAME_TWIN

[env:wing_single_esp32]
extends = wing
platform = espressif32@^6.5.0
board = esp32dev
build_flags = -DAK_AIRFRAME_SINGLE

[env:wing_twin_esp32]
extends = wing
platform = espressif32@^6.5.0
board = esp32dev
build_flags = -DAK_AIRFRAME_TWIN

[env:wing_single_f411]
extends = wing
platform = ststm32
board = blackpill_f411ce
build_flags = -DAK_AIRFRAME_SINGLE

[env:wing_twin_f411]
extends = wing
platform = ststm32
board = blackpill_f411ce
build_flags = -DAK_AIRFRAME_TWIN

[env:wing_single_f405]
extends = wing
platform = ststm32
board = genericSTM32F405RG
build_flags = -DAK_AIRFRAME_SINGLE

[env:wing_twin_f405]
extends = wing
platform = ststm32
board = genericSTM32F405RG
build_flags = -DAK_AIRFRAME_TWIN
