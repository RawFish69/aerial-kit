[env:aerialkit_rev_a3_diagnostic]
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
upload_speed = 460800
platform_packages =
	platformio/framework-arduinoespressif32@symlink://${sysenv.ELRS_USB_TX_CACHE}/framework-arduinoespressif32
	espressif/toolchain-xtensa-esp32s3@symlink://${sysenv.ELRS_USB_TX_CACHE}/toolchain-xtensa-esp32s3
	espressif/toolchain-riscv32-esp@symlink://${sysenv.ELRS_USB_TX_CACHE}/toolchain-riscv32-esp
build_flags =
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DCORE_DEBUG_LEVEL=0
