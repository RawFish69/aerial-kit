; LoRa point-to-point template (see src/config.h and README.md).
;
; Each [env:lora_*] below is just a band preset: it sets LORA_FREQ_MHZ via
; build_flags and inherits everything else from [env]. To add your own
; band/frequency, copy one of these sections and change the number --
; check your local ISM band regulations first.

[env]
platform = espressif32 @ ^6.5.0
board = esp32-c3-devkitm-1
framework = arduino
lib_deps =
  jgromes/RadioLib@^6.2.0
monitor_speed = 115200

[env:lora_433]
extends = env
build_flags = -DLORA_FREQ_MHZ=433.0

[env:lora_868]
extends = env
build_flags = -DLORA_FREQ_MHZ=868.0

[env:lora_915]
extends = env
build_flags = -DLORA_FREQ_MHZ=915.0
