[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aerial-kit"
version = "0.2.0"
description = "Aerial-robot control stack with optional simulation and visualization."
readme = "aerial_kit/README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "RawFish69" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.22", "scipy>=1.10"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
Homepage = "https://github.com/RawFish69/aerial-kit"
Repository = "https://github.com/RawFish69/aerial-kit"

[project.optional-dependencies]
viz = ["matplotlib>=3.5"]
sim = ["matplotlib>=3.5", "pyyaml>=6.0"]
rotorpy = ["matplotlib>=3.5", "pyyaml>=6.0", "rotorpy>=2.0.0"]

[project.scripts]
aerial-kit-sim = "aerial_kit.sim.cli:main"
aerial-kit-teleop = "aerial_kit.sim.teleop:main"

[tool.setuptools.packages.find]
include = ["aerial_kit*", "sim_py*"]
exclude = ["sim_py.tests*"]

[tool.setuptools.package-data]
aerial_kit = ["py.typed", "sim/defaults/*.yaml"]
sim_py = ["sim_config.yaml"]
