[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aerial-kit"
version = "0.5.0"
description = "Aerial-robot control stack with optional simulation and visualization."
readme = "aerial_kit/README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "RawFish69" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.22", "scipy>=1.10"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
]

[project.urls]
Homepage = "https://github.com/RawFish69/aerial-kit"
Repository = "https://github.com/RawFish69/aerial-kit"

[project.optional-dependencies]
viz = ["matplotlib>=3.5"]
sim = ["matplotlib>=3.5", "pyyaml>=6.0"]
rotorpy = ["matplotlib>=3.5", "pyyaml>=6.0", "rotorpy>=2.0.0"]
mujoco = ["mujoco>=3.0"]
radio = ["pyserial>=3.5"]
mavlink = ["pymavlink==2.4.49"]
all = [
    "matplotlib>=3.5",
    "pyyaml>=6.0",
    "rotorpy>=2.0.0",
    "mujoco>=3.0",
    "pyserial>=3.5",
    "pymavlink==2.4.49",
]

[project.scripts]
ak = "aerial_kit.cli:main"
aerial-kit-sim = "aerial_kit.sim.cli:main"
aerial-kit-teleop = "aerial_kit.sim.teleop:main"
aerial-kit-link = "aerial_kit.comms.cli:main"

[tool.setuptools.packages.find]
include = ["aerial_kit*", "sim_py*"]
exclude = ["aerialkit*", "apps*", "sim_py.tests*", "firmware*", "ros2_ws*", "tools*", "docker*", "scripts*", "plans*", "assets*", "docs*"]

[tool.setuptools.package-data]
aerial_kit = ["py.typed", "sim/defaults/*.yaml", "airframes/twin_wing/*.yaml"]
sim_py = ["sim_config.yaml"]

[tool.mypy]
python_version = "3.10"
files = [
    "aerial_kit/cli.py",
    "aerial_kit/comms/__init__.py",
    "aerial_kit/comms/cli.py",
    "aerial_kit/comms/crsf/__init__.py",
    "aerial_kit/comms/crsf/codec.py",
    "aerial_kit/comms/crsf/parameters.py",
    "aerial_kit/comms/crsf/uid.py",
    "aerial_kit/comms/crsf/radio.py",
    "aerial_kit/comms/crsf/msp_tunnel.py",
    "aerial_kit/comms/crsf/tunnel.py",
    "aerial_kit/comms/akp/client.py",
    "aerial_kit/comms/mavlink/client.py",
    "aerial_kit/comms/mavlink/dialect.py",
    "aerial_kit/comms/msp.py",
    "aerial_kit/comms/teleop.py",
    "aerial_kit/comms/transport.py",
    "aerial_kit/doctor.py",
    "aerial_kit/__init__.py",
    "aerial_kit/interfaces.py",
    "aerial_kit/types.py",
    "aerial_kit/registry.py",
]
strict = false
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
follow_imports = "skip"
