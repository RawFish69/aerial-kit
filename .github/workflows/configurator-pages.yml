name: Configurator and GitHub Pages

on:
  push:
    branches: [main]
    paths: ['apps/configurator/**', 'firmware/src/**', 'scripts/check_source_scope.py', 'examples/firmware/**', '.github/workflows/configurator-pages.yml']
  pull_request:
    paths: ['apps/configurator/**', 'firmware/src/**', '.github/workflows/configurator-pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: configurator-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/configurator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/configurator/package-lock.json
      - name: Check public firmware scope and source balance
        working-directory: .
        run: python3 scripts/check_source_scope.py
      - run: npm ci
      - run: npm test
      - run: python3 tools/check-citations.py && python3 tools/check-table-drift.py
      - run: npm run build
        env:
          AK_BASE: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: apps/configurator/dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
