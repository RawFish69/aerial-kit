name: Python tests

# Until this existed, the only thing that ran the Python suite was the PyPI
# release workflow - after a merge to main, as a gate on publishing. A pull
# request that broke a controller found out when the release failed.
#
# Two jobs:
#   * the `aerial_kit` / `sim_py` suite, on the oldest and newest supported
#     Python, because pyproject allows numpy>=1.22 and numpy has removed APIs
#     (trapz) the suite once used;
#   * the ROS 2 packages' ROS-free tests. Those packages keep their logic in
#     plain modules (air_unit.rtl, hw_bridge.fusion, uav_control.tracking_core,
#     ...) so it can be tested without rclpy; tests that need rclpy skip
#     themselves with pytest.importorskip.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sim:
    name: aerial_kit + sim_py (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[sim]" pytest
      - name: sim_py tests
        run: python -m pytest sim_py/tests -q
      - name: Firmware example tests
        working-directory: examples/firmware
        run: python -m pytest test_examples.py -q
      - name: Controller benchmark harness
        run: python -m pytest test_benchmarks.py -q
      - name: CRSF barometer codec
        run: python -m pytest test_crsf_barometer.py -q
      - name: Protocol vectors
        run: python protocols/check_vectors.py
      - name: Shared communications transports
        run: python -m pytest test_comms_transports.py -q
      - name: MAVLink framing, transforms and opt-in client
        run: python -m pytest test_mavlink_client.py -q
      - name: CRSF radio and parameters
        run: python -m pytest test_crsf_radio.py -q
      - name: AKP typed client and host firmware
        run: python -m pytest test_akp_client.py test_akp_host.py -q
      - name: AKP client and host protocol engine
        run: python -m pytest test_akp_client.py test_akp_host.py -q

  ros-packages:
    name: ROS 2 package logic (no ROS)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[sim]" pytest
      # Each package is run from its own directory, which is how its tests
      # import the package without a colcon build.
      - name: air_unit
        working-directory: ros2_ws/src/air_unit
        run: python -m pytest test -q
      - name: hw_bridge
        working-directory: ros2_ws/src/hw_bridge
        run: python -m pytest test -q
      - name: mavlink_bridge
        working-directory: ros2_ws/src/mavlink_bridge
        run: python -m pytest test -q
      - name: uav_control
        working-directory: ros2_ws/src/uav_control
        run: python -m pytest test -q
      - name: uav_algorithms
        working-directory: ros2_ws/src/uav_algorithms
        run: python -m pytest test -q

  distribution:
    name: clean install and wheel contents
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Base install has no ROS, MuJoCo or development code
        run: |
          python -m venv /tmp/aerial-kit-base
          /tmp/aerial-kit-base/bin/python -m pip install --upgrade pip
          /tmp/aerial-kit-base/bin/python -m pip install "${GITHUB_WORKSPACE}"
          cd /tmp
          /tmp/aerial-kit-base/bin/python - <<'PY'
          import importlib.util
          import aerial_kit
          import sim_py

          assert importlib.util.find_spec("rclpy") is None
          assert importlib.util.find_spec("mujoco") is None
          assert importlib.util.find_spec("matplotlib") is None
          assert importlib.util.find_spec("yaml") is None
          assert importlib.util.find_spec("serial") is None
          assert importlib.util.find_spec("pymavlink") is None
          assert importlib.util.find_spec("sim_py.tests") is None
          print("base import:", aerial_kit.__name__, sim_py.__name__)
          PY

      - name: Simulator extra installs only its declared dependencies
        run: |
          python -m venv /tmp/aerial-kit-sim
          /tmp/aerial-kit-sim/bin/python -m pip install --upgrade pip
          /tmp/aerial-kit-sim/bin/python -m pip install "${GITHUB_WORKSPACE}[sim]"
          cd /tmp
          /tmp/aerial-kit-sim/bin/python - <<'PY'
          import importlib.util
          import aerial_kit
          import matplotlib
          import sim_py
          import yaml

          assert importlib.util.find_spec("rclpy") is None
          assert importlib.util.find_spec("mujoco") is None
          assert importlib.util.find_spec("serial") is None
          assert importlib.util.find_spec("pymavlink") is None
          assert importlib.util.find_spec("sim_py.tests") is None
          print("sim import:", aerial_kit.__name__, sim_py.__name__, yaml.__version__)
          PY

      - name: Protocol extras install only their declared dependencies
        run: |
          python -m venv /tmp/aerial-kit-radio
          /tmp/aerial-kit-radio/bin/python -m pip install --upgrade pip
          /tmp/aerial-kit-radio/bin/python -m pip install "${GITHUB_WORKSPACE}[radio]"
          /tmp/aerial-kit-radio/bin/python - <<'PY'
          import importlib.util
          import serial

          assert importlib.util.find_spec("pymavlink") is None
          print("radio extra:", serial.__version__)
          PY

          python -m venv /tmp/aerial-kit-mavlink
          /tmp/aerial-kit-mavlink/bin/python -m pip install --upgrade pip
          /tmp/aerial-kit-mavlink/bin/python -m pip install "${GITHUB_WORKSPACE}[mavlink]" pytest
          /tmp/aerial-kit-mavlink/bin/python - <<'PY'
          import pymavlink

          print("mavlink extra:", pymavlink.__file__)
          PY
      - name: MAVLink against the pymavlink dialect
        run: /tmp/aerial-kit-mavlink/bin/python -m pytest test_mavlink_client.py -q

      - name: Packaged FC-SIL explains that firmware sources are absent
        run: |
          cd /tmp
          /tmp/aerial-kit-base/bin/python - <<'PY'
          from sim_py.fc_sil import AkFlightCore

          try:
              AkFlightCore()
          except RuntimeError as exc:
              message = str(exc).lower()
              assert "firmware" in message and "source" in message, message
              print(message)
          else:
              raise SystemExit("packaged FC-SIL unexpectedly built without firmware sources")
          PY

      - name: Wheel and sdist contain only runtime packages
        run: |
          python - <<'PY'
          from pathlib import Path
          import tarfile
          import zipfile

          required_wheel = {
              "aerial_kit/__init__.py",
              "sim_py/__init__.py",
              "sim_py/fc_sil/__init__.py",
              "sim_py/fc_sil/build.py",
          }
          forbidden = {"firmware", "ros2_ws", "tools", "docker", "scripts", "plans", "assets", "docs"}

          wheels = list(Path("dist").glob("*.whl"))
          sdists = list(Path("dist").glob("*.tar.gz"))
          assert len(wheels) == 1 and len(sdists) == 1

          with zipfile.ZipFile(wheels[0]) as archive:
              names = set(archive.namelist())
          assert required_wheel <= names
          assert not {name.split("/", 1)[0] for name in names} & forbidden
          assert not any("/tests/" in name for name in names)

          with tarfile.open(sdists[0]) as archive:
              top = {name.split("/", 1)[0] for name in archive.getnames()}
          assert len(top) == 1
          assert not next(iter(top)).split("-", 1)[0] in forbidden
          print("distribution contents: OK")
          PY

  public-api:
    name: public API and typing
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[sim]" mypy pytest
      - name: Type-check the public API
        run: python -m mypy
      - name: Public API and README quickstart
        run: python -m pytest test_public_api.py -q

  ros2-jazzy:
    # The tests above skip anything that needs rclpy. This job runs them for
    # real: hw_bridge's SITL scenario (fake FC -> estimator -> CRSF adapter ->
    # command manager -> mission executor: takeoff, hover, land, mission, RTL)
    # and uav_control's tracker flying a mission against the sim_fast backend.
    # Neither had ever run in CI, and both found real bugs the first time.
    name: ROS 2 Jazzy integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: ros:jazzy
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            python3-numpy python3-scipy python3-yaml python3-pytest \
            ros-jazzy-nav-msgs ros-jazzy-geometry-msgs ros-jazzy-sensor-msgs ros-jazzy-visualization-msgs
      # Only the message package needs building; the tests import the Python
      # packages from the source tree.
      - name: Build uav_msgs
        working-directory: ros2_ws
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --packages-select uav_msgs
      - name: hw_bridge (incl. SITL closed loop)
        working-directory: ros2_ws/src/hw_bridge
        run: |
          source /opt/ros/jazzy/setup.bash
          source ../../install/setup.bash
          export PYTHONPATH="$GITHUB_WORKSPACE:$PYTHONPATH"
          python3 -m pytest test -q
      - name: uav_control (incl. sim_fast mission)
        working-directory: ros2_ws/src/uav_control
        run: |
          source /opt/ros/jazzy/setup.bash
          source ../../install/setup.bash
          export PYTHONPATH="$GITHUB_WORKSPACE:$PYTHONPATH"
          python3 -m pytest test -q
