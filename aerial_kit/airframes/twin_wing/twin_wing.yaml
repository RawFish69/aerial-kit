# Aerial Kit twin-motor flying wing -- single source of truth.
#
# Consumed by:
#   aerial_kit.airframes.twin_wing.spec       (loader, derived geometry, mass split)
#   aerial_kit.airframes.twin_wing.mjcf       (MuJoCo model, generated at runtime)
#   aerial_kit.airframes.twin_wing.sdf        (Gazebo visual model)
#   scripts/generate_twin_wing_assets.py      (writes the Gazebo model + meshes;
#                                              `--check` fails on drift)
#
# Frame: body FRD (x forward, y right, z down). The origin is the reference
# centre of gravity and the aerodynamic moment reference of
# aerial_kit.dynamics.fixed_wing.
#
# Provenance: every number here is a research default for a ~1.5 kg foam
# flying wing. Nothing is a measurement of a real airframe, and the aero
# coefficients in FixedWingParams are not fitted to this geometry. Geometry
# is chosen so that the planform is *consistent* with the aero reference
# values (area, span, mean chord), not so that it reproduces them from CFD.

schema_version: 1
name: aerial_kit_twin_wing

mass_properties:
  total_mass_kg: 1.5
  # Composite inertia about the CG, body FRD. Research default, not measured.
  inertia_kg_m2: [0.05, 0.03, 0.06]
  # The CG is the frame origin by definition; listed for readers.
  cg_m: [0.0, 0.0, 0.0]

aero_reference:
  # These three feed FixedWingParams. The planform below must agree with
  # them (checked by tests): S = b * (c_root + c_tip) / 2, c_mean = S / b.
  wing_area_m2: 0.35
  wingspan_m: 1.4
  mean_chord_m: 0.25

wing:
  root_chord_m: 0.345
  tip_chord_m: 0.155
  le_sweep_deg: 28.0
  # Root leading edge, ahead of the CG. Puts the CG ~10 % MAC ahead of the
  # quarter-chord neutral-point estimate of this planform.
  root_le_x_m: 0.20
  dihedral_deg: 0.0
  # Geometric twist at the tip, leading edge down. Visual only: the aero
  # model has no spanwise loading, so this changes no force.
  washout_deg: 2.0
  airfoil:
    root_thickness: 0.105      # t/c
    tip_thickness: 0.085
    max_camber: 0.016          # reflexed camber line, fraction of chord
    reflex_start: 0.62         # camber goes negative aft of this x/c
  spanwise_sections: 9

center_body:
  # Equipment bay pod, faired into the wing centre section.
  nose_x_m: 0.33
  tail_x_m: -0.17
  max_width_m: 0.15
  max_height_m: 0.105
  # Fraction of the pod height above the wing reference plane (z < 0).
  top_fraction: 0.66
  hatch:
    from_x_m: 0.22
    to_x_m: -0.04
    width_fraction: 0.62
  camera_window_x_m: 0.318

fins:
  root_chord_m: 0.15
  tip_chord_m: 0.075
  height_m: 0.13
  le_sweep_deg: 38.0
  thickness: 0.09              # t/c
  # Fin root LE relative to the wing tip LE (positive = further aft).
  root_le_offset_x_m: 0.005

elevons:
  inboard_y_m: 0.22
  outboard_y_m: 0.64
  chord_fraction: 0.25         # of the local wing chord, hinge to trailing edge
  hinge_gap_m: 0.003           # visible slot between wing and surface
  mass_kg_each: 0.025
  # Positive deflection is trailing edge UP (nose-up for pitch).
  travel_deg: 25.0             # commanded range, matches TwinWingAirframe.max_elevon_rad
  mechanical_limit_deg: 27.0   # hinge stop, slightly beyond servo travel
  servo:
    kp_nm_per_rad: 35.0
    kv_nms_per_rad: 2.5
    max_rate_rad_s: 8.0        # ~0.13 s / 60 deg, a slow digital servo
    force_limit_nm: 12.0
    joint_damping_nms: 0.08
    armature_kg_m2: 0.001      # reflected servo gear-train inertia
  # Aerial Kit's actuator vector is [thrust_L, thrust_R, elevon_L, elevon_R]
  # in physical left/right order. Trailing-edge-up is positive; pitch up is
  # positive (elevon_L + elevon_R), and roll right is positive
  # (elevon_R - elevon_L).
  command_index:
    left: 2
    right: 3

propulsion:
  max_thrust_n: 10.0
  thrust_tau_s: 0.03
  # Motors are tractors on the leading edge. spin is the sign of rotation
  # about body +x (right-hand rule): +1 is clockwise seen from behind.
  # Counter-rotating, inboard blades rising.
  motors:
    left:
      y_m: -0.30
      spin: -1
    right:
      y_m: 0.30
      spin: 1
  thrust_line_z_m: 0.0
  prop_plane_ahead_of_le_m: 0.085
  prop:
    diameter_m: 0.23
    blades: 2
    root_pitch_deg: 38.0
    tip_pitch_deg: 13.0
    max_chord_m: 0.024
    tip_chord_m: 0.011
    thickness_m: 0.0035
    hub_radius_m: 0.009
    spinner_radius_m: 0.016
    spinner_length_m: 0.034
  rotor:
    # Prop + outrunner bell, the part that turns.
    mass_kg: 0.030
    # Inertia of a real 9-inch prop + bell about the shaft.
    physical_inertia_kg_m2: 2.4e-5
    # Full-thrust shaft speed of the real prop (~11500 rpm).
    physical_max_speed_rad_s: 1200.0
    # The simulated shaft runs slower so the blades read in a 60 Hz viewer
    # instead of strobing. Shaft inertia is scaled by physical/visual speed so
    # the angular momentum (gyroscopic coupling) matches the real rotor.
    visual_max_speed_rad_s: 150.0
    bearing_damping_nms: 2.0e-6
  nacelle:
    radius_m: 0.021
    length_m: 0.20
    bell_radius_m: 0.0145
    bell_length_m: 0.02

materials:
  # rgba. Restrained palette: light top, dark bottom, orange moving surfaces,
  # red port / green starboard tips.
  wing_top: [0.78, 0.79, 0.77, 1.0]
  wing_bottom: [0.22, 0.24, 0.27, 1.0]
  center_body: [0.30, 0.33, 0.37, 1.0]
  hatch: [0.12, 0.20, 0.30, 1.0]
  camera_window: [0.03, 0.03, 0.04, 1.0]
  fin: [0.19, 0.36, 0.56, 1.0]
  elevon: [0.95, 0.47, 0.12, 1.0]
  hinge: [0.70, 0.71, 0.73, 1.0]
  nacelle: [0.17, 0.18, 0.20, 1.0]
  motor_bell: [0.66, 0.68, 0.71, 1.0]
  prop_blade: [0.08, 0.08, 0.09, 1.0]
  prop_tip: [0.98, 0.80, 0.10, 1.0]
  spinner: [0.80, 0.81, 0.83, 1.0]
  nav_left: [0.90, 0.10, 0.10, 1.0]
  nav_right: [0.10, 0.80, 0.25, 1.0]

collision:
  # Coarse primitives used for ground contact only. Visual meshes never collide.
  center_box_half_m: [0.24, 0.07, 0.05]
  wing_capsule_radius_m: 0.016
