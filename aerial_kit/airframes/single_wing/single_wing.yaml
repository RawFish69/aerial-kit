# Aerial Kit single-motor flying wing -- research-default source of truth.
#
# Frame: body FRD (x forward, y right, z down). The origin is the reference
# CG and aerodynamic moment reference. Every number is a plausible research
# default for a small foam flying wing, not a measurement or fitted value.

schema_version: 1
name: aerial_kit_single_wing

mass_properties:
  total_mass_kg: 1.10
  inertia_kg_m2: [0.035, 0.022, 0.045]
  cg_m: [0.0, 0.0, 0.0]

aero_reference:
  wing_area_m2: 0.24
  wingspan_m: 1.20
  mean_chord_m: 0.20

wing:
  root_chord_m: 0.28
  tip_chord_m: 0.12
  le_sweep_deg: 25.0
  root_le_x_m: 0.16
  dihedral_deg: 1.0
  washout_deg: 2.0
  airfoil:
    root_thickness: 0.11
    tip_thickness: 0.085
    max_camber: 0.018
    reflex_start: 0.60
    spanwise_sections: 8

center_body:
  nose_x_m: 0.27
  tail_x_m: -0.14
  max_width_m: 0.13
  max_height_m: 0.095

fins:
  root_chord_m: 0.13
  tip_chord_m: 0.06
  height_m: 0.11
  le_sweep_deg: 36.0
  thickness: 0.09
  root_le_offset_x_m: 0.0

elevons:
  inboard_y_m: 0.18
  outboard_y_m: 0.54
  chord_fraction: 0.25
  hinge_gap_m: 0.003
  mass_kg_each: 0.018
  travel_deg: 25.0
  mechanical_limit_deg: 27.0

aero_coefficients:
  cl0: 0.17
  cl_alpha_per_rad: 5.30
  alpha_stall_deg: 14.0
  stall_blend_rate: 25.0
  cd0: 0.030
  induced_drag_k: 0.0663
  cm0: 0.0
  cm_alpha: -0.45
  cm_q: -7.5
  cm_delta_e: 0.62
  cl_beta: -0.05
  cl_p: -0.45
  cl_delta_a: 0.11
  cn_beta: 0.06
  cn_r: -0.06
  air_density_kg_m3: 1.225
  gravity_mps2: 9.81

propulsion:
  max_thrust_n: 8.0
  thrust_tau_s: 0.05
  motor:
    # Pusher on the centreline, slightly above the wing reference plane.
    position_m: [-0.135, 0.0, -0.035]
    thrust_axis: [1.0, 0.0, 0.0]
    # +1 turns clockwise viewed from behind. Motor reaction is opposite.
    spin: 1
    reaction_torque_nm_per_n: 0.0060
    rotor_inertia_kg_m2: 4.0e-5
  propeller:
    diameter_m: 0.20
    blades: 2
    inertia_kg_m2: 8.0e-6
  prop_wash:
    # Small pusher-wash allowance. The prop is behind the wing and elevons,
    # so this is intentionally much weaker than a tractor configuration.
    authority_gain: 0.08

features:
  motor_reaction_torque: true
  thrust_lag: true
  prop_wash: true
  thrust_offset_moment: true

materials:
  wing_top: [0.76, 0.77, 0.75, 1.0]
  wing_bottom: [0.22, 0.24, 0.27, 1.0]
  body: [0.30, 0.33, 0.37, 1.0]
  elevon: [0.95, 0.47, 0.12, 1.0]
  fin: [0.19, 0.36, 0.56, 1.0]
  prop: [0.08, 0.08, 0.09, 1.0]

collision:
  center_box_half_m: [0.20, 0.06, 0.045]
  wing_capsule_radius_m: 0.014

flight_envelope:
  # Operational defaults, not hard limits. Minimum is above the approximately
  # 8.8 m/s stall speed implied by this research-default lift model.
  cruise_airspeed_mps: 14.0
  min_airspeed_mps: 9.0
  max_airspeed_mps: 24.0
  max_climb_rate_mps: 3.0
  max_bank_deg: 45.0

# ---------------------------------------------------------------------------
# MuJoCo articulation and visual (used by single_wing/mjcf.py; the analytic
# backend ignores this block). Research defaults, not measurements.
articulation:
  elevon_servo:
    kp_nm_per_rad: 25.0
    kv_nms_per_rad: 1.8
    max_rate_rad_s: 8.0
    force_limit_nm: 8.0
    joint_damping_nms: 0.06
    armature_kg_m2: 0.0008
  rotor:
    mass_kg: 0.025                 # prop + outrunner bell (the part that turns)
    physical_max_speed_rad_s: 1300.0
    visual_max_speed_rad_s: 150.0
    bearing_damping_nms: 2.0e-6
  prop_visual:
    root_pitch_deg: 36.0
    tip_pitch_deg: 12.0
    max_chord_m: 0.022
    tip_chord_m: 0.010
    thickness_m: 0.0032
    hub_radius_m: 0.008
    spinner_radius_m: 0.014
    spinner_length_m: 0.030
  motor_pod:
    radius_m: 0.019
    length_m: 0.11
  visual_materials:
    hatch: [0.12, 0.20, 0.30, 1.0]
    camera_window: [0.03, 0.03, 0.04, 1.0]
    hinge: [0.70, 0.71, 0.73, 1.0]
    nacelle: [0.17, 0.18, 0.20, 1.0]
    motor_bell: [0.66, 0.68, 0.71, 1.0]
    prop_tip: [0.98, 0.80, 0.10, 1.0]
    spinner: [0.80, 0.81, 0.83, 1.0]
    nav_left: [0.90, 0.10, 0.10, 1.0]
    nav_right: [0.10, 0.80, 0.25, 1.0]
