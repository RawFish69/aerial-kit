path:
  # Fractions of the terrain box for start/end positions
  # Values are multiplied by space_dim (default: [100, 100, 50])
  # 0.0 = start of map, 1.0 = end of map, >1.0 = outside map
  start_relative_x: 0.0
  start_relative_y: 0.0
  start_relative_z: 0.05

  end_relative_x: 1.0  # Use 0.95-0.98 to stay within map, or >1.0 to go outside
  end_relative_y: 1.0
  end_relative_z: "auto"  # "auto" picks a random height in [0, tallest tree]

  # Random XY offsets (added after relative->absolute conversion), in meters.
  # Each axis is sampled uniformly in [-range, +range] then clamped to map bounds.
  start_xy_offset_range: 100.0
  end_xy_offset_range: 100.0

  # Path planner settings
  # planner_type: "straight" | "astar" | "rrt" | "rrt*" | "dubins"
  # "dubins" produces a single curvature-feasible start->goal path; turn_radius_m
  # defaults from the selected airframe's Capabilities.min_turn_radius_m when set
  # (e.g. twin_wing), otherwise defaults to 20.0 -- override with path.turn_radius_m.
  planner_type: "rrt*"
  grid_resolution: 1.5       # For A* (smaller = finer grid, better avoidance)
  collision_inflation: 1.5    # Safety margin around obstacles [m] (increase to stay farther)
  terrain_clearance: 2.0      # For mountains: altitude margin over terrain [m]
  rrt_step_size: 5.0         # For RRT
  rrt_max_iterations: 2000
  goal_tolerance: 2.0        # RRT goal radius [m]
  rrt_goal_sample_rate: 0.1  # RRT/RRT*: probability of sampling the goal
  rrt_star_rewire_radius:    # RRT*: set (meters) or leave blank for auto

controller:
  # Default high-level controller: "pid", "lqr", or "mpc"
  controller_type: "pid"

  # Simulation horizon and timestep
  sim_time: 240       # [s]  (increase to let it travel far)
  dt: 0.01              # [s]

  # Max acceleration magnitude allowed for any controller
  acc_max: 50.0         # [m/s^2]

  pid:
    kp: 1.5
    kd: 2.0

  lqr:
    q_pos: 10.0
    q_vel: 2.0
    r_acc: 1.0

  mpc:
    q_pos: 8.0
    q_vel: 2.0
    r_acc: 10.0

visual:
  # Forest density multiplier (1.0 = as in ROS terrain YAML)
  forest_density_scale: 1.0

  # Forest tree appearance
  tree_linewidth: 5.0
  tree_alpha: 0.9
  # Scale factor on forest tree height range from terrain_params.yaml
  tree_height_scale: 4.0
  # Scale the space Z dimension relative to tallest tree
  height_ratio: 1.2
  # Reference trunk radius used for linewidth scaling
  tree_radius_ref: 1.0

  # UAV trajectory appearance
  path_color: "deepskyblue"
  path_linewidth: 3.0
  marker_size: 40.0

  # Planned path appearance
  planned_linewidth: 2.0
  planned_alpha: 0.85

  # Mountains terrain surface appearance
  terrain_alpha: 0.45
  terrain_cmap: "terrain"

vehicle:
  # Airframe profile: "quad" (default), "hex", or "octo".
  # Not yet consumed by the simulation loop (workstream 02, phase 1) --
  # PointMassBackend still integrates accel_cmd directly. This selects the
  # Airframe object created via aerial_kit.registry.create_airframe.
  airframe: "quad"

simulation:
  # Dynamics backend: "pointmass" (default) or "rotorpy"
  backend: "pointmass"

  # Optional deterministic seed for planner/randomized start-goal offsets.
  # Remove or set null for non-deterministic runs.
  # seed: 123

  rotorpy:
    # v1 backend currently supports RotorPy's crazyflie params.
    vehicle: "crazyflie"
    aero: true
    enable_ground: false

  # FixedWingBackend params (workstream 04). Not CLI-selectable yet -- see the
  # comment on --backend in sim_py/app/cli.py. Aero/inertia coefficients are a
  # plausible default set for a ~1.5 kg foam flying wing, not a fitted model of
  # any real airframe; override per-field as real airframe data becomes available.
  fixedwing:
    mass_kg: 1.5
    wing_area_m2: 0.35
    wingspan_m: 1.4
    mean_chord_m: 0.25
    inertia_kg_m2: [0.05, 0.03, 0.06]
    wind_mps: [0.0, 0.0, 0.0]
